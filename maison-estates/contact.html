  <main>
    <section>
      <h1>Hai să găsim următoarea ta adresă.</h1>
      <p>Completează formularul și revenim către tine cu o propunere.</p>

       <form action="#" method="post">
        <label for="nume">Nume complet</label>
        <input type="text" id="nume" name="nume" required>

        <label for="email">Adresă de e-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="tip">Tipul proprietății</label>
        <select id="tip" name="tip">
          <option>Vilă contemporană</option>
          <option>Casă mediteraneană</option>
          <option>Apartament elegant</option>
        </select>

        <label for="mesaj">Mesaj</label>
        <textarea id="mesaj" name="mesaj" rows="5"></textarea>

        <button type="submit" class="btn">Trimite solicitarea</button>
      </form>
    </section>
  </main>

  <footer>
    <p>MAISON ESTATES · Spații în care merită să te întorci acasă.</p>
